<div id="__ROOT__"><p class="scope"></p><p>Display-only inspection. Filtering does not recalculate statistics or change saved flags.</p><div class="filter"></div><div class="search"></div><div class="count" role="status"></div><div class="plot"></div><div class="rows" style="overflow:auto;max-height:420px"></div></div>
<script>(()=>{'use strict';const root=document.getElementById('__ROOT__'),p=__PAYLOAD__,{Inputs,Plot}=window,$=s=>root.querySelector(s);
$('.scope').textContent=`First ${p.rows.length} of ${p.total} input rows, in input order. Native tables and saved flags use all rows. Missing values remain missing; flagged values are not deleted.`;
const filter=Inputs.select(['All','Missing','Flagged'],{label:'Row status',value:'All'}),search=Inputs.search(p.rows,{label:'Original row search',columns:['row']});$('.filter').append(filter);$('.search').append(search);
function draw(){const rows=search.value.filter(r=>filter.value==='All'||r.status===filter.value);$('.count').textContent=`${rows.length} matching preview rows; full-data results unchanged.`;
$('.rows').replaceChildren(Inputs.table(rows,{columns:['row','value','status','votes'],header:{row:'Original row',value:p.variable,status:'Screening status',votes:'Method votes'},select:false,maxHeight:380}));
if(p.numeric){const plot=Plot.plot({width:650,height:320,style:{background:'transparent',color:'inherit'},x:{label:'Input row position'},y:{label:p.variable},color:{domain:['Not flagged','Flagged','Not assessed'],range:['#3975b8','#df852d','#888'],legend:true},marks:[Plot.dot(rows.filter(r=>r.value!==null),{x:'position',y:'value',fill:'status',tip:true,title:r=>`Row ${r.row}: ${r.value}; ${r.status}; votes ${r.votes??'unavailable'}`})]});$('.plot').replaceChildren(plot);}}
filter.addEventListener('input',draw);search.addEventListener('input',draw);draw();})();</script>
