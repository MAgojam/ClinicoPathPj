<div id="__ID__" class="cpj-flow">
<style>
.cpj-flow{color:inherit;background:transparent;font:14px system-ui;padding:8px}
.cpj-flow svg{width:100%;height:auto;min-width:600px}.cpj-flow .drawing{overflow-x:auto}
.cpj-flow text{fill:currentColor}.cpj-flow select,.cpj-flow button{font:inherit;max-width:100%}
.cpj-flow :focus-visible{outline:3px solid currentColor;outline-offset:2px}
</style>
<p>Ribbon thickness counts rows. Hover a ribbon, or choose a path with the keyboard to highlight all its segments. Highlighting is local; native tables and the static diagram remain unchanged.</p>
<label>Highlighted flow <select aria-label="Highlighted flow"><option value="">All flows</option></select></label>
<button type="button">Clear highlight</button>
<p class="status" role="status" aria-live="polite">All flows shown.</p>
<div class="drawing"></div>
<script>
(()=>{'use strict';
const root=document.getElementById('__ID__'), data=__PAYLOAD__,g=data.drawing;
const select=root.querySelector('select'),status=root.querySelector('.status'),ns='http://www.w3.org/2000/svg';
const colors=['#4477AA','#EE6677','#228833','#CCBB44','#66CCEE','#AA3377','#BBBBBB'];
function el(tag,attrs,parent){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));parent.appendChild(e);return e;}
const svg=el('svg',{viewBox:'0 0 1000 620',role:'img','aria-label':'Alluvial row counts; exact values in native tables'},root.querySelector('.drawing'));
const x=j=>85+j*830/(g.names.length-1),y=v=>50+v*510/g.height,scale=510/g.height;
for(const f of data.flows){const o=document.createElement('option');o.value=String(f.id);o.textContent='#'+f.id+' '+JSON.stringify(f.labels)+' — '+f.n+' rows';select.appendChild(o);}
for(const r of g.ribbons){const a=x(r.axis)+7,b=x(r.axis+1)-7,m=(a+b)/2,s=y(r.source),t=y(r.target),h=r.n*scale;
const d=`M${a},${s} C${m},${s} ${m},${t} ${b},${t} L${b},${t+h} C${m},${t+h} ${m},${s+h} ${a},${s+h} Z`;
const p=el('path',{d,fill:colors[r.group%colors.length],'fill-opacity':.48,'data-flow':r.flow},svg);
const title=el('title',{},p),f=data.flows.find(v=>v.id===r.flow);title.textContent='#'+f.id+' '+JSON.stringify(f.labels)+': '+f.n+' rows ('+(100*f.percent).toFixed(2)+'%)';
p.addEventListener('mouseenter',()=>highlight(String(r.flow)));p.addEventListener('mouseleave',()=>highlight(select.value));}
for(const n of g.nodes){el('rect',{x:x(n.axis)-7,y:y(n.y),width:14,height:n.n*scale,fill:'currentColor','fill-opacity':.65},svg);
const text=el('text',{x:x(n.axis)+(n.axis===g.names.length-1?-12:12),y:y(n.y+n.n/2), 'text-anchor':n.axis===g.names.length-1?'end':'start','font-size':12},svg);text.textContent=n.label+' (n='+n.n+')';}
g.names.forEach((name,j)=>{const t=el('text',{x:x(j),y:24,'text-anchor':'middle','font-size':14},svg);t.textContent=name;});
function highlight(id){for(const p of svg.querySelectorAll('[data-flow]'))p.setAttribute('fill-opacity',id===''?.48:p.getAttribute('data-flow')===id?.85:.08);
const f=data.flows.find(v=>String(v.id)===id);status.textContent=f?'Flow #'+f.id+': '+JSON.stringify(f.labels)+'; '+f.n+' rows; '+(100*f.percent).toFixed(2)+'% of retained rows.':'All flows shown.';}
select.addEventListener('change',()=>highlight(select.value));root.querySelector('button').addEventListener('click',()=>{select.value='';highlight('');});
})();
</script></div>
