title: Interactive Diagnostic Dotplot (Python)
name: pydotdecision
jus: '3.0'
stage: 0
compilerMode: aggressive
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Numeric test measurement
        children:
          - type: VariablesListBox
            name: marker
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Binary reference classification
        children:
          - type: VariablesListBox
            name: reference
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: LevelSelector
        name: positive
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: direction
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: criterion
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: cutoff
        format: string
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: logScale
      - type: CheckBox
        name: showConsole
