{
  "name": "cpDiagnostic",
  "title": "Diagnostic cutoff - ClinicoPathPj bridge",
  "menuGroup": "ClinicoPathPj",
  "menuSubgroup": "Python bridge comparison",
  "version": "0.1.0",
  "jas": "1.2",
  "options": [
    {
      "name": "data",
      "type": "Data"
    },
    {
      "name": "marker",
      "title": "Numeric test measurement",
      "type": "Variable",
      "permitted": [
        "numeric"
      ],
      "suggested": [
        "continuous"
      ],
      "default": null
    },
    {
      "name": "reference",
      "title": "Binary reference classification",
      "type": "Variable",
      "permitted": [
        "factor"
      ],
      "suggested": [
        "nominal"
      ],
      "default": null
    },
    {
      "name": "positive",
      "title": "Reference positive level",
      "type": "Level",
      "variable": "(reference)",
      "allowNone": true
    },
    {
      "name": "direction",
      "title": "Positive test rule",
      "type": "List",
      "options": [
        {
          "name": "high",
          "title": "Measurement >= cutoff"
        },
        {
          "name": "low",
          "title": "Measurement <= cutoff"
        }
      ],
      "default": "high"
    },
    {
      "name": "criterion",
      "title": "Automatic cutoff criterion",
      "type": "List",
      "options": [
        {
          "name": "errors",
          "title": "Fewest errors (FP + FN)"
        },
        {
          "name": "youden",
          "title": "Maximum Youden index"
        }
      ],
      "default": "errors"
    },
    {
      "name": "cutoff",
      "title": "Applied cutoff (blank = automatic)",
      "type": "String",
      "default": ""
    },
    {
      "name": "logScale",
      "title": "Logarithmic measurement axis",
      "type": "Bool",
      "default": false,
      "hidden": true
    },
    {
      "name": "showConsole",
      "title": "Python console output",
      "type": "Bool",
      "default": false
    }
  ]
}