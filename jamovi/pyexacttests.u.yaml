title: Exact Tests for 2x2 Tables (Python)
name: pyexacttests
jus: '3.0'
stage: 0
compilerMode: aggressive
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: 'Group (paired: first measurement)'
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: 'Outcome (paired: second measurement)'
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Counts (optional)
        children:
          - type: VariablesListBox
            name: counts
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: LevelSelector
        name: event
  - type: LayoutBox
    margin: large
    children:
      - type: LevelSelector
        name: refLevel
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: design
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: alternative
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: ciWidth
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: showConsole
