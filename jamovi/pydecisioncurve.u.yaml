title: Decision Curve Analysis (Python)
name: pydecisioncurve
jus: '3.0'
stage: 0
compilerMode: aggressive
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Binary reference outcome
        children:
          - type: VariablesListBox
            name: outcome
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Predicted probability columns
        children:
          - type: VariablesListBox
            name: models
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: LevelSelector
        name: positive
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: thresholdMin
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: thresholdMax
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: thresholdStep
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: showPlot
      - type: CheckBox
        name: showConsole
